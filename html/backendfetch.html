<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-Commerce Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 30px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 30px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
        }

        button:hover {
            background: #555;
        }

        select,
        input {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .categories,
        .products {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .category,
        .product {
            width: 220px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .category img,
        .product img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .category h3,
        .product h3 {
            margin: 10px 0;
        }

        .category p,
        .product p {
            margin: 6px 0;
        }

        .section {
            margin-bottom: 40px;
        }

        #message {
            margin: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>E-Commerce Productss</h1>

    <div id="message"></div>


    <!-- ==================================================
         CATEGORY SECTION
    ================================================== -->

    <div class="section">

        <h2>Categories</h2>

        <button onclick="getCategories()">
            Get Categories
        </button>

        <button onclick="addCategory()">
            Add Category
        </button>

        <div class="categories" id="categories"></div>

    </div>


    <!-- ==================================================
         PRODUCT SECTION
    ================================================== -->

    <div class="section">

        <h2>Add Product</h2>

        <select id="category">
            <option value="">
                Select Category
            </option>
        </select>

        <br>

        <input
            type="text"
            id="title"
            placeholder="Product title"
        >

        <input
            type="text"
            id="brand"
            placeholder="Brand"
        >

        <input
            type="number"
            id="price"
            placeholder="Price"
        >

        <input
            type="number"
            id="stock"
            placeholder="Stock"
        >

        <input
            type="text"
            id="image_url"
            placeholder="Image URL"
            style="width: 400px;"
        >

        <br>

        <button onclick="addProduct()">
            Add Product
        </button>

        <button onclick="getProducts()">
            Get Products
        </button>

    </div>


    <!-- ==================================================
         UPDATE PRODUCT
    ================================================== -->

    <div class="section">

        <h2>Update Product</h2>

        <input
            type="number"
            id="updateId"
            placeholder="Product ID"
        >

        <button onclick="updateProduct()">
            Update Product
        </button>

    </div>


    <!-- ==================================================
         DELETE PRODUCT
    ================================================== -->

    <div class="section">

        <h2>Delete Product</h2>

        <input
            type="number"
            id="deleteId"
            placeholder="Product ID"
        >

        <button onclick="deleteProduct()">
            Delete Product
        </button>

    </div>


    <!-- ==================================================
         PRODUCTS DISPLAY
    ================================================== -->

    <div class="section">

        <div class="products" id="products"></div>

    </div>


<script>

const API = "https://ecommerce-backend-production-b444.up.railway.app";


// ======================================================
// MESSAGE
// ======================================================

function showMessage(message) {

    document.getElementById("message").textContent = message;

}


// ======================================================
// GET CATEGORIES
// ======================================================

async function getCategories() {

    try {

        const response = await fetch(
            API + "/categories/"
        );

        if (!response.ok) {

            throw new Error(
                "Failed to fetch categories"
            );

        }

        const categories =
            await response.json();

        console.log("Categories:", categories);


        // ----------------------------------------------
        // Fill category dropdown
        // ----------------------------------------------

        const select =
            document.getElementById("category");

        select.innerHTML =
            '<option value="">Select Category</option>';


        categories.forEach(category => {

            const option =
                document.createElement("option");

            option.value = category.id;

            option.textContent =
                category.name;

            select.appendChild(option);

        });


        // ----------------------------------------------
        // Display categories
        // ----------------------------------------------

        const container =
            document.getElementById("categories");

        container.innerHTML = "";


        if (categories.length === 0) {

            container.innerHTML =
                "<p>No categories found.</p>";

            showMessage("No categories found.");

            return;
        }


        categories.forEach(category => {

            const div =
                document.createElement("div");

            div.className = "category";


            div.innerHTML = `

                <img
                    src="${category.image_url || 'https://via.placeholder.com/180'}"
                    alt="${category.name}"
                >

                <h3>
                    ${category.name}
                </h3>

                <p>
                    <strong>ID:</strong>
                    ${category.id}
                </p>

                <p>
                    ${category.description || ""}
                </p>

            `;


            container.appendChild(div);

        });


        showMessage(
            categories.length +
            " categories loaded."
        );

    }
    catch (error) {

        console.error(error);

        showMessage(
            "Error loading categories."
        );

    }

}
getCategories();


// ======================================================
// ADD CATEGORY
// ======================================================

async function addCategory() {

    // Ask user for category details

    const name =
        prompt("Enter category name:");

    if (!name) {

        alert("Category name is required.");

        return;
    }


    const description =
        prompt("Enter category description:");

    if (!description) {

        alert("Category description is required.");

        return;
    }


    const image_url =
        prompt("Enter category image URL:");

    if (!image_url) {

        alert("Category image URL is required.");

        return;
    }


    try {

        const response = await fetch(

            API + "/categories/",

            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    name: name,

                    description:
                        description,

                    image_url:
                        image_url

                })

            }

        );


        const data =
            await response.json();


        if (!response.ok) {

            console.error(data);

            alert(
                data.detail ||
                "Failed to create category."
            );

            return;
        }


        console.log(
            "Category added:",
            data
        );


        alert(
            "Category added successfully!"
        );


        // Only refresh because user pressed Add Category

        getCategories();

    }
    catch (error) {

        console.error(error);

        alert(
            "Error adding category."
        );

    }

}


// ======================================================
// ADD PRODUCT
// ======================================================

async function addProduct() {

    // ----------------------------------------------
    // Get selected category
    // ----------------------------------------------

    const categoryId =
        document.getElementById("category").value;


    if (categoryId === "") {

        alert(
            "First click 'Get Categories' and select a category."
        );

        return;
    }


    // ----------------------------------------------
    // Get product values
    // ----------------------------------------------

    const title =
        document.getElementById("title").value.trim();

    const brand =
        document.getElementById("brand").value.trim();

    const price =
        document.getElementById("price").value;

    const stock =
        document.getElementById("stock").value;

    const image_url =
        document.getElementById("image_url").value.trim();


    // ----------------------------------------------
    // Validation
    // ----------------------------------------------

    if (!title) {

        alert("Enter product title.");

        return;
    }


    if (!brand) {

        alert("Enter product brand.");

        return;
    }


    if (price === "") {

        alert("Enter product price.");

        return;
    }


    if (stock === "") {

        alert("Enter product stock.");

        return;
    }


    if (!image_url) {

        alert("Enter product image URL.");

        return;
    }


    // ----------------------------------------------
    // Send product
    // ----------------------------------------------

    try {

        const response = await fetch(

            API + "/products/",

            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    category_id:
                        Number(categoryId),

                    title:
                        title,

                    description:
                        title + " product",

                    brand:
                        brand,

                    image_url:
                        image_url,

                    images: [],

                    specifications: {},

                    price:
                        Number(price),

                    stock:
                        Number(stock)

                })

            }

        );


        const data =
            await response.json();


        console.log(
            "Product response:",
            data
        );


        if (!response.ok) {

            console.error(data);

            alert(
                data.detail ||
                "Failed to create product."
            );

            return;
        }


        alert(
            "Product created successfully!"
        );


        // Clear inputs

        document.getElementById("title").value = "";

        document.getElementById("brand").value = "";

        document.getElementById("price").value = "";

        document.getElementById("stock").value = "";

        document.getElementById("image_url").value = "";


        // Don't automatically display products.
        // User must press Get Products.

    }
    catch (error) {

        console.error(error);

        alert(
            "Error creating product."
        );

    }

}


// ======================================================
// GET PRODUCTS
// ======================================================

async function getProducts() {

    try {

        const response = await fetch(

            API +
            "/products/?skip=0&limit=20"

        );


        if (!response.ok) {

            throw new Error(
                "Failed to fetch products"
            );

        }


        const products =
            await response.json();


        console.log(
            "Products:",
            products
        );


        const container =
            document.getElementById("products");


        container.innerHTML = "";


        if (products.length === 0) {

            container.innerHTML =
                "<p>No products found.</p>";

            showMessage(
                "No products found."
            );

            return;
        }


        products.forEach(product => {

            const div =
                document.createElement("div");

            div.className = "product";


            div.innerHTML = `

                <img
                    src="${product.image_url || 'https://via.placeholder.com/180'}"
                    alt="${product.title}"
                >

                <h3>
                    ${product.title}
                </h3>

                <p>
                    <strong>ID:</strong>
                    ${product.id}
                </p>

                <p>
                    <strong>Category ID:</strong>
                    ${product.category_id}
                </p>

                <p>
                    <strong>Brand:</strong>
                    ${product.brand}
                </p>

                <p>
                    <strong>Price:</strong>
                    ₹${product.price}
                </p>

                <p>
                    <strong>Stock:</strong>
                    ${product.stock}
                </p>

                <p>
                    ${product.description || ""}
                </p>

            `;


            container.appendChild(div);

        });


        showMessage(
            products.length +
            " products loaded."
        );

    }
    catch (error) {

        console.error(error);

        showMessage(
            "Error loading products."
        );

    }

}


// ======================================================
// UPDATE PRODUCT
// ======================================================

async function updateProduct() {

    const productId =
        document.getElementById("updateId").value;


    if (!productId) {

        alert("Enter Product ID.");

        return;
    }


    // Get category

    const categoryId =
        document.getElementById("category").value;


    if (!categoryId) {

        alert(
            "First click Get Categories and select a category."
        );

        return;
    }


    // Get values

    const title =
        document.getElementById("title").value.trim();

    const brand =
        document.getElementById("brand").value.trim();

    const price =
        document.getElementById("price").value;

    const stock =
        document.getElementById("stock").value;

    const image_url =
        document.getElementById("image_url").value.trim();


    if (!title ||
        !brand ||
        price === "" ||
        stock === "" ||
        !image_url) {

        alert(
            "Fill all product fields before updating."
        );

        return;
    }


    try {

        const response = await fetch(

            API +
            "/products/" +
            productId,

            {

                method: "PUT",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    category_id:
                        Number(categoryId),

                    title:
                        title,

                    description:
                        title + " product",

                    brand:
                        brand,

                    image_url:
                        image_url,

                    images: [],

                    specifications: {},

                    price:
                        Number(price),

                    stock:
                        Number(stock)

                })

            }

        );


        const data =
            await response.json();


        console.log(
            "Updated:",
            data
        );


        if (!response.ok) {

            alert(
                data.detail ||
                "Failed to update product."
            );

            return;
        }


        alert(
            "Product updated successfully!"
        );


      

    }
    catch (error) {

        console.error(error);

        alert(
            "Error updating product."
        );

    }

}


// ======================================================
// DELETE PRODUCT
// ======================================================

async function deleteProduct() {

    const productId =
        document.getElementById("deleteId").value;


    if (!productId) {

        alert(
            "Enter Product ID."
        );

        return;
    }


    const confirmDelete =
        confirm(
            "Are you sure you want to delete product " +
            productId +
            "?"
        );


    if (!confirmDelete) {

        return;
    }


    try {

        const response = await fetch(

            API +
            "/products/" +
            productId,

            {

                method: "DELETE"

            }

        );


        const data =
            await response.json();


        console.log(
            "Deleted:",
            data
        );


        if (!response.ok) {

            alert(
                data.detail ||
                "Failed to delete product."
            );

            return;
        }


        alert(
            "Product deleted successfully!"
        );


        document.getElementById("deleteId").value = "";

        

    }
    catch (error) {

        console.error(error);

        alert(
            "Error deleting product."
        );

    }

}


</script>

</body>

</html>
