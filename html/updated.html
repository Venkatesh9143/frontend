<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #111827;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 14px;
            font-weight: 600;
        }

        .add-category {
            background: #eef2ff;
            color: #4338ca;
        }

        .add-product {
            background: #111827;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .container {
            width: 90%;
            max-width: 1400px;
            margin: 30px auto;
        }

        .page-title {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .page-subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 21px;
            margin-bottom: 16px;
        }

        .categories {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 35px;
        }

        .categories::-webkit-scrollbar {
            height: 5px;
        }

        .categories::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .category {
            min-width: 150px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .category:hover {
            transform: translateY(-2px);
            border-color: #111827;
        }

        .category.active {
            border: 2px solid #111827;
            background: #f9fafb;
        }

        .category img {
            width: 100px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .category h3 {
            font-size: 15px;
        }

        .products-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .selected-category {
            color: #6b7280;
            font-size: 14px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            cursor: pointer;
            transition: 0.25s;
        }

        .product:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .product-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background: #f3f4f6;
        }

        .product-content {
            padding: 16px;
        }

        .product-title {
            font-size: 17px;
            margin-bottom: 7px;
        }

        .product-brand {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .product-price {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .product-stock {
            font-size: 13px;
            color: #16a34a;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
            background: white;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 16px;
            padding: 25px;
            position: relative;
        }

        .close {
            position: absolute;
            right: 18px;
            top: 15px;
            background: #f3f4f6;
            color: #111827;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            padding: 0;
            font-size: 18px;
        }

        .modal-title {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #111827;
        }

        .submit-btn {
            width: 100%;
            background: #111827;
            color: white;
            margin-top: 8px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .details-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 12px;
            background: #f3f4f6;
        }

        .details-info {
            padding: 10px 0;
        }

        .details-info h2 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .details-brand {
            color: #6b7280;
            margin-bottom: 20px;
        }

        .details-price {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .details-description {
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .details-stock {
            margin-bottom: 20px;
            color: #16a34a;
        }

        .back-btn {
            background: #f3f4f6;
            color: #111827;
        }

        .message {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #111827;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            display: none;
            z-index: 500;
        }

        @media (max-width: 700px) {
            header {
                padding: 14px 4%;
            }

            .logo {
                font-size: 20px;
            }

            .header-actions button {
                padding: 9px 10px;
                font-size: 12px;
            }

            .container {
                width: 92%;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .details-image {
                height: 280px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🛍️ My Store</div>

    <div class="header-actions">
        <button class="add-category" onclick="openAddCategory()">
            + Add Category
        </button>

        <button class="add-product" onclick="openAddProduct()">
            + Add Product
        </button>
    </div>
</header>

<main class="container">

    <h1 class="page-title">Explore Products</h1>
    <p class="page-subtitle">Choose a category to discover products</p>

    <h2 class="section-title">Categories</h2>

    <div class="categories" id="categories">
        <div class="loading">Loading categories...</div>
    </div>

    <div class="products-header">
        <div>
            <h2 class="section-title" id="productsTitle">
                Products
            </h2>
            <div class="selected-category" id="selectedCategory">
                Select a category
            </div>
        </div>
    </div>

    <div class="products" id="products">
        <div class="empty">
            <h3>Select a category</h3>
            <p>Products will appear here.</p>
        </div>
    </div>

</main>

<div class="modal" id="categoryModal">

    <div class="modal-box">

        <button class="close" onclick="closeModal('categoryModal')">
            ×
        </button>

        <h2 class="modal-title">Add Category</h2>

        <div class="form-group">
            <label>Category Name</label>
            <input type="text" id="categoryName" placeholder="Enter category name">
        </div>

        <div class="form-group">
            <label>Description</label>
            <input type="text" id="categoryDescription" placeholder="Enter description">
        </div>

        <div class="form-group">
            <label>Image URL</label>
            <input type="text" id="categoryImage" placeholder="Enter image URL">
        </div>

        <button class="submit-btn" onclick="addCategory()">
            Add Category
        </button>

    </div>

</div>

<div class="modal" id="productModal">

    <div class="modal-box">

        <button class="close" onclick="closeModal('productModal')">
            ×
        </button>

        <h2 class="modal-title">Add Product</h2>

        <div class="form-group">
            <label>Category</label>
            <select id="category">
                <option value="">Select Category</option>
            </select>
        </div>

        <div class="form-group">
            <label>Product Title</label>
            <input type="text" id="title" placeholder="Enter product title">
        </div>

        <div class="form-group">
            <label>Brand</label>
            <input type="text" id="brand" placeholder="Enter brand">
        </div>

        <div class="form-group">
            <label>Price</label>
            <input type="number" id="price" placeholder="Enter price">
        </div>

        <div class="form-group">
            <label>Stock</label>
            <input type="number" id="stock" placeholder="Enter stock">
        </div>

        <div class="form-group">
            <label>Image URL</label>
            <input type="text" id="image_url" placeholder="Enter image URL">
        </div>

        <button class="submit-btn" onclick="addProduct()">
            Add Product
        </button>

    </div>

</div>

<div class="modal" id="detailsModal">

    <div class="modal-box">

        <button class="close" onclick="closeModal('detailsModal')">
            ×
        </button>

        <div id="productDetails"></div>

    </div>

</div>

<div class="message" id="message"></div>

<script>

const API = "https://ecommerce-backend-production-b444.up.railway.app";

let categoriesData = [];
let currentCategoryId = null;

function showMessage(text) {
    const message = document.getElementById("message");

    message.textContent = text;
    message.style.display = "block";

    setTimeout(() => {
        message.style.display = "none";
    }, 2500);
}

function openModal(id) {
    document.getElementById(id).classList.add("show");
}

function closeModal(id) {
    document.getElementById(id).classList.remove("show");
}

function openAddCategory() {
    alert("Please log in first to add categories.");
}

function openAddProduct() {
    alert("Please log in first to add products.");
}

async function getCategories() {

    const container = document.getElementById("categories");

    try {

        const response = await fetch(API + "/categories/");

        if (!response.ok) {
            throw new Error("Failed to load categories");
        }

        categoriesData = await response.json();

        container.innerHTML = "";

        if (categoriesData.length === 0) {
            container.innerHTML = `
                <div class="empty">
                    <h3>No categories available</h3>
                </div>
            `;
            return;
        }

        categoriesData.forEach(category => {

            const div = document.createElement("div");

            div.className = "category";

            div.innerHTML = `
                <img 
                    src="${category.image_url || 'https://via.placeholder.com/180'}"
                    alt="${category.name}"
                >
                <h3>${category.name}</h3>
            `;

            div.onclick = () => {
                selectCategory(category.id, category.name, div);
            };

            container.appendChild(div);

        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                <h3>Unable to load categories</h3>
                <p>Please try again later.</p>
            </div>
        `;

    }
}

async function selectCategory(categoryId, categoryName, element) {

    currentCategoryId = categoryId;

    document.querySelectorAll(".category").forEach(item => {
        item.classList.remove("active");
    });

    element.classList.add("active");

    document.getElementById("productsTitle").textContent =
        categoryName + " Products";

    document.getElementById("selectedCategory").textContent =
        "Products in " + categoryName;

    await getProductsByCategory(categoryId);

}

async function getProductsByCategory(categoryId) {

    const container = document.getElementById("products");

    container.innerHTML = `
        <div class="loading">
            Loading products...
        </div>
    `;

    try {

        const response = await fetch(
            API + `/products/?skip=0&limit=100`
        );

        if (!response.ok) {
            throw new Error("Failed to load products");
        }

        const products = await response.json();

        const filteredProducts = products.filter(
            product => Number(product.category_id) === Number(categoryId)
        );

        container.innerHTML = "";

        if (filteredProducts.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h3>No products found</h3>
                    <p>There are no products in this category yet.</p>
                </div>
            `;

            return;
        }

        filteredProducts.forEach(product => {

            const div = document.createElement("div");

            div.className = "product";

            div.innerHTML = `
                <img
                    class="product-image"
                    src="${product.image_url || 'https://via.placeholder.com/400'}"
                    alt="${product.title}"
                >

                <div class="product-content">

                    <h3 class="product-title">
                        ${product.title}
                    </h3>

                    <p class="product-brand">
                        ${product.brand || "No brand"}
                    </p>

                    <p class="product-price">
                        ₹${product.price}
                    </p>

                    <p class="product-stock">
                        ${product.stock > 0
                            ? product.stock + " items available"
                            : "Out of stock"}
                    </p>

                </div>
            `;

            div.onclick = () => {
                showProductDetails(product);
            };

            container.appendChild(div);

        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                <h3>Unable to load products</h3>
                <p>Please try again later.</p>
            </div>
        `;

    }
}

function showProductDetails(product) {

    const container = document.getElementById("productDetails");

    container.innerHTML = `
        <div class="details">

            <div>
                <img
                    class="details-image"
                    src="${product.image_url || 'https://via.placeholder.com/500'}"
                    alt="${product.title}"
                >
            </div>

            <div class="details-info">

                <h2>${product.title}</h2>

                <p class="details-brand">
                    ${product.brand || "No brand"}
                </p>

                <p class="details-price">
                    ₹${product.price}
                </p>

                <p class="details-description">
                    ${product.description || "No description available."}
                </p>

                <p class="details-stock">
                    ${product.stock > 0
                        ? product.stock + " items available"
                        : "Out of stock"}
                </p>

                <button class="back-btn" onclick="closeModal('detailsModal')">
                    Back to Products
                </button>

            </div>

        </div>
    `;

    openModal("detailsModal");
}

function fillCategorySelect() {

    const select = document.getElementById("category");

    select.innerHTML =
        '<option value="">Select Category</option>';

    categoriesData.forEach(category => {

        const option = document.createElement("option");

        option.value = category.id;
        option.textContent = category.name;

        select.appendChild(option);

    });
}

async function addCategory() {

    const name =
        document.getElementById("categoryName").value.trim();

    const description =
        document.getElementById("categoryDescription").value.trim();

    const image_url =
        document.getElementById("categoryImage").value.trim();

    if (!name) {
        alert("Enter category name.");
        return;
    }

    if (!description) {
        alert("Enter category description.");
        return;
    }

    if (!image_url) {
        alert("Enter category image URL.");
        return;
    }

    try {

        const response = await fetch(
            API + "/categories/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name,
                    description,
                    image_url
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {

            alert(
                data.detail ||
                "Failed to create category."
            );

            return;
        }

        alert("Category added successfully.");

        document.getElementById("categoryName").value = "";
        document.getElementById("categoryDescription").value = "";
        document.getElementById("categoryImage").value = "";

        closeModal("categoryModal");

        await getCategories();

    } catch (error) {

        console.error(error);

        alert("Error adding category.");

    }
}

async function addProduct() {

    const categoryId =
        document.getElementById("category").value;

    const title =
        document.getElementById("title").value.trim();

    const brand =
        document.getElementById("brand").value.trim();

    const price =
        document.getElementById("price").value;

    const stock =
        document.getElementById("stock").value;

    const image_url =
        document.getElementById("image_url").value.trim();

    if (!categoryId) {
        alert("Select a category.");
        return;
    }

    if (!title) {
        alert("Enter product title.");
        return;
    }

    if (!brand) {
        alert("Enter product brand.");
        return;
    }

    if (price === "") {
        alert("Enter product price.");
        return;
    }

    if (stock === "") {
        alert("Enter product stock.");
        return;
    }

    if (!image_url) {
        alert("Enter product image URL.");
        return;
    }

    try {

        const response = await fetch(
            API + "/products/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    category_id: Number(categoryId),
                    title: title,
                    description: title + " product",
                    brand: brand,
                    image_url: image_url,
                    images: [],
                    specifications: {},
                    price: Number(price),
                    stock: Number(stock)
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {

            alert(
                data.detail ||
                "Failed to create product."
            );

            return;
        }

        alert("Product created successfully.");

        document.getElementById("title").value = "";
        document.getElementById("brand").value = "";
        document.getElementById("price").value = "";
        document.getElementById("stock").value = "";
        document.getElementById("image_url").value = "";

        closeModal("productModal");

        if (currentCategoryId) {
            const category = categoriesData.find(
                item => Number(item.id) === Number(currentCategoryId)
            );

            if (category) {
                await getProductsByCategory(currentCategoryId);
            }
        }

    } catch (error) {

        console.error(error);

        alert("Error creating product.");

    }
}

window.addEventListener("DOMContentLoaded", async () => {

    await getCategories();

    fillCategorySelect();

});

window.addEventListener("click", event => {

    if (event.target.classList.contains("modal")) {
        event.target.classList.remove("show");
    }

});

</script>

</body>
</html>
