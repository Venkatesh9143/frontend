<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>

    <style>
        body {
            background-color: black;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: orange;
        }

        ul li {
            background-color: blue;
            color: white;
        }

        div {
            width: 300px;
            height: 150px;
            background-color: pink;


            padding: 20px;
            border: 2px solid red;
            border-radius: 16px;
            padding-left: 16px;
            padding-bottom: 16px;
            padding-right: 16px;
            padding-top: 16px;
            padding: 32px 16px;
            margin: 60px;


        }

        p {
            color: green;
        }
    </style>
</head>

<body>

    <h1>What is the CSS Box Model?</h1>

    <ul>
        <li>Width</li>
        <li>Height</li>
        <li>Padding</li>
        <li>Margin</li>
        <li>Border</li>
    </ul>

    <div>
        <p>Hello CSS Box Model</p>
    </div>

</body>

</html>
